<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mi Radio Online</title>
    <style>
        /* --- Reset y estilos base --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #1a1e2c, #2d3349);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        /* --- Tarjeta del reproductor --- */
        .player-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo { font-size: 48px; display: block; margin-bottom: 10px; }
        h1 {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { font-size: 14px; color: #aab; margin: 8px 0 30px 0; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        audio {
            width: 100%;
            margin: 10px 0 25px 0;
            border-radius: 60px;
            background: #2d3349;
            height: 54px;
        }
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            color: #ccd;
            background: rgba(0,0,0,0.25);
            padding: 12px 20px;
            border-radius: 60px;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse-dot 1.8s infinite;
        }
        .status-dot.paused {
            background: #f87171;
            box-shadow: 0 0 10px #f87171;
            animation: none;
        }
        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
        .footer { margin-top: 25px; font-size: 12px; color: #667; }
        .footer a { color: #8899bb; text-decoration: none; }

        /* --- PANTALLA DE INICIO (OVERLAY) PARA EL AUTOPLAY --- */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 22, 36, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 0.6s ease;
            color: white;
            text-align: center;
            padding: 30px;
        }
        /* Cuando está oculto, se desvanece y no bloquea clics */
        #startOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #startOverlay .icon-big {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce-phone 2s infinite;
        }
        #startOverlay h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #startOverlay p {
            font-size: 16px;
            color: #aab;
            max-width: 280px;
        }
        #startOverlay .tap-hint {
            margin-top: 30px;
            font-size: 14px;
            background: rgba(255,255,255,0.1);
            padding: 12px 30px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.15);
            -webkit-text-fill-color: #fff;
        }
        @keyframes bounce-phone {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <!-- ===================================================== -->
    <!--  PANTALLA DE BIENVENIDA (TOCA PARA EMPEZAR)          -->
    <!-- ===================================================== -->
    <div id="startOverlay">
        <div class="icon-big">📻</div>
        <h2>¡Radio en vivo!</h2>
        <p>Toca en cualquier parte de la pantalla para comenzar a escuchar</p>
        <div class="tap-hint">👆 Toca aquí para reproducir</div>
    </div>

    <!-- ===================================================== -->
    <!--  REPRODUCTOR PRINCIPAL                                -->
    <!-- ===================================================== -->
    <div class="player-card">
        <span class="logo">🎙️</span>
        <h1>Mi Radio Online</h1>
        <p class="subtitle">🎶 Sonido en vivo las 24 horas</p>

        <!-- 
            IMPORTANTE: 
            Cambia la URL del "src" por la que te dio Vercel.
            Debe quedar así: https://TU_PROYECTO.vercel.app/stream
        -->
        <audio id="radioPlayer" controls>
            <source src="https://stream.zeno.fm/rnnnjjs6nt4uv" type="audio/mpeg">
            Tu navegador no soporta el reproductor.
        </audio>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Esperando inicio...</span>
        </div>
        <div class="footer">Hecho con ❤️ · Mi Radio</div>
    </div>

    <script>
        // ============================================================
        //  LÓGICA PARA QUE LA RADIO COMIENCE AUTOMÁTICAMENTE AL TOCAR
        // ============================================================
        const overlay = document.getElementById('startOverlay');
        const audio = document.getElementById('radioPlayer');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // --- 1. Función para iniciar la reproducción ---
        function iniciarRadio() {
            // Intentamos reproducir el audio
            const promesa = audio.play();

            if (promesa !== undefined) {
                promesa.then(() => {
                    // Éxito: el audio está sonando
                    overlay.classList.add('hidden');
                    statusDot.className = 'status-dot';
                    statusText.textContent = '🔴 EN VIVO';
                }).catch((error) => {
                    // Si falla (por política del navegador), mostramos un mensaje
                    console.warn('Autoplay bloqueado, esperando interacción:', error);
                    statusText.textContent = '⚠️ Toca la pantalla para iniciar';
                    // Aseguramos que el overlay siga visible para que el usuario toque de nuevo
                    overlay.classList.remove('hidden');
                });
            }
        }

        // --- 2. Al hacer clic en el overlay, se inicia la radio ---
        overlay.addEventListener('click', function() {
            // Ocultamos el overlay visualmente (para dar feedback rápido)
            overlay.classList.add('hidden');
            // Y forzamos la reproducción
            const promesa = audio.play();
            
            if (promesa !== undefined) {
                promesa.then(() => {
                    statusDot.className = 'status-dot';
                    statusText.textContent = '🔴 EN VIVO';
                }).catch(() => {
                    // Si aun así falla, mostramos el overlay de nuevo
                    overlay.classList.remove('hidden');
                    statusText.textContent = '⚠️ Toca para reproducir';
                });
            }
        });

        // --- 3. También intentamos iniciar automáticamente al cargar la página ---
        // Esto funciona en algunos navegadores si el usuario ya dio permiso antes.
        window.addEventListener('load', function() {
            // Pequeño retraso para asegurar que el DOM esté listo
            setTimeout(() => {
                iniciarRadio();
            }, 500);
        });

        // --- 4. Actualizar el estado visual del reproductor ---
        audio.addEventListener('playing', () => {
            statusDot.className = 'status-dot';
            statusText.textContent = '🔴 EN VIVO';
        });

        audio.addEventListener('pause', () => {
            statusDot.className = 'status-dot paused';
            statusText.textContent = '⏸ Pausado';
        });

        audio.addEventListener('error', () => {
            statusDot.className = 'status-dot paused';
            statusText.textContent = '⚠️ Error en el stream';
        });

        audio.addEventListener('waiting', () => {
            statusText.textContent = '⏳ Buffering...';
        });
    </script>
</body>
</html>
