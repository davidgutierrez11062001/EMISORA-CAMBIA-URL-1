<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mi Radio Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #1a1e2c, #2d3349);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }
        .player-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .logo { font-size: 48px; display: block; margin-bottom: 10px; }
        h1 {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { font-size: 14px; color: #aab; margin: 8px 0 30px 0; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        audio {
            width: 100%;
            margin: 10px 0 25px 0;
            border-radius: 60px;
            background: #2d3349;
            height: 54px;
        }
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            color: #ccd;
            background: rgba(0,0,0,0.25);
            padding: 12px 20px;
            border-radius: 60px;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse-dot 1.8s infinite;
        }
        .status-dot.paused {
            background: #f87171;
            box-shadow: 0 0 10px #f87171;
            animation: none;
        }
        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
        .footer { margin-top: 25px; font-size: 12px; color: #667; }
        .footer a { color: #8899bb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="player-card">
        <span class="logo">📻</span>
        <h1>Mi Radio Online</h1>
        <p class="subtitle">🎶 Sonido en vivo las 24 horas</p>

        <!-- ========================================================= -->
        <!--  REPRODUCTOR: CAMBIA "TU_USUARIO" por el tuyo             -->
        <!-- ========================================================= -->
        <audio id="radioPlayer" controls autoplay>
            <source src="https://stream.zeno.fm/rnnnjjs6nt4uv" type="audio/mpeg">
            Tu navegador no soporta el reproductor de audio.
        </audio>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Conectando...</span>
        </div>
        <div class="footer">Hecho con ❤️ · Mi Radio</div>
    </div>

    <script>
        const audio = document.getElementById('radioPlayer');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        audio.addEventListener('loadstart', () => {
            statusDot.className = 'status-dot';
            statusText.textContent = 'Cargando...';
        });
        audio.addEventListener('canplay', () => {
            statusDot.className = 'status-dot';
            statusText.textContent = '🔴 EN VIVO';
        });
        audio.addEventListener('playing', () => {
            statusDot.className = 'status-dot';
            statusText.textContent = '🔴 EN VIVO';
        });
        audio.addEventListener('pause', () => {
            statusDot.className = 'status-dot paused';
            statusText.textContent = '⏸ Pausado';
        });
        audio.addEventListener('error', () => {
            statusDot.className = 'status-dot paused';
            statusText.textContent = '⚠️ Error al cargar el stream';
        });
        audio.addEventListener('waiting', () => {
            statusText.textContent = '⏳ Buffering...';
        });
    </script>
</body>
</html>
